<h4>حالا از شخصیت سیب‌زمینیت بیش‌تر برامون بگو</h4>
<p>
    هر کدوم از ورودی‌های زیر رو که دوست داشتی پر کن. این بهمون کمک می‌کنه که اون رو دقیق‌تر بسازیم و کارت شناساییش رو برات آماده کنیم!
</p>

<div class="personality-form py-5">

  <div class="row g-3">

    <!-- Birth month -->
    <div class="col-md-6">
      <label class="form-label">
        ماه تولد
        &nbsp;
        ✦
        &nbsp;
        عنصر:
        <span *ngIf="state.birthMonth" [style.color]="state.element.color">
          {{ state.element.name }}
          <img src="/elements/{{ state.element.img }}" class="element-img">
        </span>
        <span *ngIf="!state.birthMonth">-</span>
      </label>

      <select class="form-select" [(ngModel)]="state.birthMonth">
        <option disabled selected>
          انتخاب ماه
        </option>
        
        <option *ngFor="let month of months" [ngValue]="month.name">
          {{ month.name }}
        </option>
      </select>
    </div>

    <!-- MBTI -->
    <div class="col-md-6">
      <label class="form-label">
        تیپ شخصیتی MBTI
      </label>

      <select class="form-select" [(ngModel)]="state.mbti">
        <option disabled selected>
          انتخاب تیپ
        </option>
        
        <option
          *ngFor="let type of mbtiTypes"
          [ngValue]="type.code"
          [style.color]="type.color">
          {{ type.code }} - {{ type.name }}
        </option>
      </select>
    </div>


    <!-- Strengths -->
    <div class="col-md-6">
      <div class="d-flex align-items-center gap-2 mb-2">
        <label class="form-label mb-0">
          نقاط قوت
        </label>
      </div>

      <div class="input-group" dir="ltr">
        <button
          type="button"
          class="btn btn-primary"
          (click)="addStrength()">
          <i class="bi bi-plus-lg"></i>
        </button>

        <input
          dir="rtl"
          class="form-control"
          placeholder="افزودن نقطه قوت..."
          [(ngModel)]="newStrength"
          (keydown.enter)="addStrength()">
      </div>

      <small
        *ngIf="state.strengths.length === 0"
        class="text-muted d-block mt-2">
        * نقطه قوت را وارد کنید و روی دکمه + بزنید.
      </small>

      <div class="tag-input mt-2">
        <div
          class="badge bg-success"
          *ngFor="let strength of state.strengths">

          {{ strength }}

          <i
            class="bi bi-x-lg me-2"
            (click)="removeStrength(strength)">
          </i>
        </div>
      </div>
    </div>


    <!-- Weaknesses -->
    <div class="col-md-6">
      <label class="form-label">
        نقاط ضعف
      </label>

      <div class="input-group" dir="ltr">
        <button
          type="button"
          class="btn btn-primary"
          (click)="addWeakness()">
          <i class="bi bi-plus-lg"></i>
        </button>

        <input
          dir="rtl"
          class="form-control"
          placeholder="افزودن نقطه ضعف..."
          [(ngModel)]="newWeakness"
          (keydown.enter)="addWeakness()">
      </div>
      
      <small
        *ngIf="state.weaknesses.length === 0"
        class="text-muted d-block mt-2">
        * نقطه ضعف را وارد کنید و روی دکمه + بزنید.
      </small>

      <div class="tag-input mt-2">
        <div
          class="badge bg-danger"
          *ngFor="let weakness of state.weaknesses">

          {{ weakness }}

          <i
            class="bi bi-x-lg me-1"
            (click)="removeWeakness(weakness)">
          </i>

        </div>
      </div>
    </div>


    <!-- Favorite food -->
    <div class="col-md-6">
      <label class="form-label">
        خوراکی مورد علاقه
      </label>

      <input class="form-control" [(ngModel)]="state.favoriteFood">
    </div>


    <!-- Hobby -->
    <div class="col-md-6">
      <label class="form-label">
        سرگرمی مورد علاقه
      </label>

      <input class="form-control" [(ngModel)]="state.favoriteHobby">
    </div>


    <!-- Fun fact -->
    <div class="col-12">
      <label class="form-label">
        یه فکت جالب درباره این شخصیت
      </label>

      <input class="form-control" [(ngModel)]="state.funFact">
    </div>

  </div>

</div>
