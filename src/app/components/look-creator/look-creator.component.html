<h4>اول ببینیم سیب‌زمینیت قراره چه شکلی باشه...</h4>

<div class="outer-flex d-flex flex-wrap justify-content-between py-5">
    <form class="ms-lg-5">
        <div class="form-group mb-4">
            <label for="nameInput" class="form-label">اسم سیب‌زمینی</label>

            <input
            class="form-control"
            id="nameInput"
            name="nameInput"
            [ngModel]="state.potatoName()"
            (ngModelChange)="state.potatoName.set($event)">
        </div>

        <div class="form-group mb-4">
        <label class="form-label">
            عرض جعبه
        </label>

            <select
                class="form-select"
                [(ngModel)]="state.boxWidth"
                name="boxWidth">

                <option
                    *ngFor="let size of sizes"
                    [ngValue]="size.width">
                    {{ size.width.toLocaleString('fa-IR') }} سانتی متر
                </option>
            </select>
        </div>

        <div class="sm-view mb-5">
            <app-creator-wizard></app-creator-wizard>
        </div>

        <div class="form-group mb-5 mb-lg-4">
            <label for="fileInput" class="form-label">هر عکس رفرنسی که داری که می‌تونه به دقیق‌تر ساختن چیزی که توی ذهنته به ما کمک کنه این‌جا آپلود کن</label>

            <div class="upload-box"
            [class.drag-over]="isDragging"
            (click)="fileInput.click()"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)"
            (drop)="onDrop($event)">

            <i class="bi bi-images fs-1"></i>

            <p class="mb-0">
                عکس‌ها را اینجا رها کنید
            </p>

            <small class="text-muted">
                یا کلیک کرده و انتخاب کنید
            </small>

            <div class="preview-grid mt-3">
                @for(image of images; track image.preview) {

                <div class="preview-card">
                    <img [src]="image.preview">

                    <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    (click)="removeImage(image, $event)">
                    <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                }
            </div>
            </div>
            
            <input
            #fileInput
            type="file"
            accept="image/*"
            multiple
            hidden
            (change)="onFileSelected($event)">
        </div>

        <div class="needed-items mb-5 mb-lg-4">

            <label class="form-label">
            اگر می‌خوای تعداد بیش‌تری از آیتم‌های آماده رو همزمان داشته باشی یا آیتمی مد نظر داری که پیداش نمی‌کنی (آیتم سفارشی)، می‌تونی از این‌جا اضافش کنی
            </label>

            <div
            class="needed-item-row"
            *ngFor="let item of state.extraItems; let i = index">

            <div class="item-type-group d-flex flex-wrap">
                <label class="form-check">
                <input
                    class="form-check-input"
                    type="radio"
                    [name]="'itemType' + i"
                    [(ngModel)]="item.isCustom"
                    [value]="false">
                <span class="form-check-label">آماده</span>
                </label>

                <label class="form-check">
                <input
                    class="form-check-input"
                    type="radio"
                    [name]="'itemType' + i"
                    [(ngModel)]="item.isCustom"
                    [value]="true">
                <span class="form-check-label">سفارشی</span>
                </label>
            </div>

            <input
                class="form-control"
                placeholder="توضیح کوتاه"
                [(ngModel)]="item.description"
                name="itemDescription">

            <label class="reference-image upload-btn">

                <input
                hidden
                type="file"
                accept="image/*"
                (change)="onItemImageSelected($event, item)">

                <img
                *ngIf="item.preview"
                [src]="item.preview"
                alt="Reference image">

                <i
                *ngIf="!item.preview"
                class="bi bi-image"></i>

            </label>

            <button
                type="button"
                class="btn btn-danger remove-btn"
                (click)="removeItem(i)">
                <i class="bi bi-x"></i>
            </button>

            </div>

            <div>
            <button
            class="btn btn-primary mt-2"
            type="button"
            (click)="addItem()">

            <i class="bi bi-plus"></i>
            اضافه کردن آیتم

            </button>
            </div>

        </div>

        <div class="mb-4">
            <label for="descriptionTextarea" class="form-label">هر توضیح دیگه‌ای که لازم می‌دونی بدونیم رو اینجا اضافه کن (ویژگی‌های مهم، رنگ متفاوت برای آیتم‌ها و...)</label>
            <textarea class="form-control" id="descriptionTextarea" rows="3"></textarea>
        </div>
    </form>

    <div class="lg-view m-5">
        <app-creator-wizard></app-creator-wizard>
    </div>

    <img src="/textures/hr.png" class="hr my-4">

    <table class="table pricing-table text-warning mt-3">
        <tr *ngFor="let row of pricingService.getBreakdown().breakdown">
            <td class="ps-3 ps-lg-5">{{ row.title }}</td>
            <td class="table-price">{{ row.cost.toLocaleString('fa-IR') }}</td>
        </tr>

        <tr class="fw-bold">
            <td class="ps-3 ps-lg-5">جمع</td>
            <td class="table-price">{{ pricingService.getBreakdown().total.toLocaleString('fa-IR') }} تومان</td>
        </tr>
    </table>
</div>
