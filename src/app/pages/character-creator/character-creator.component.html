<div class="p-5">
  <div class="creator-steps">
    <div class="step" [class.active]="currentStep >= 1">۱</div>
    <div class="line" [class.active]="currentStep >= 2"></div>
    <div class="step" [class.active]="currentStep >= 2">۲</div>
    <div class="line" [class.active]="currentStep >= 3"></div>
    <div class="step" [class.active]="currentStep >= 3">۳</div>
  </div>

  @if (currentStep === 1) {
    <app-creator-explanation></app-creator-explanation>
  }

  @if (currentStep === 2) {
    <div class="d-flex flex-wrap justify-content-between py-5">
      <form>
        <div class="form-group mb-4">
          <label for="nameInput" class="form-label">اسم سیب‌زمینی</label>

          <input
            class="form-control"
            id="nameInput"
            name="nameInput"
            [(ngModel)]="potatoName">
        </div>

        <div class="form-group mb-4">
          <label for="fileInput" class="form-label">هر عکس رفرنسی که داری که می‌تونه به دقیق‌تر ساختن چیزی که توی ذهنته به ما کمک کنه این‌جا آپلود کن</label>

          <div class="upload-box"
            [class.drag-over]="isDragging"
            (click)="fileInput.click()"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)"
            (drop)="onDrop($event)">

            <i class="bi bi-images fs-1"></i>

            <p class="mb-0">
              عکس‌ها را اینجا رها کنید
            </p>

            <small class="text-muted">
              یا کلیک کرده و انتخاب کنید
            </small>

            <div class="preview-grid mt-3">
              @for(image of images; track image.preview) {

                <div class="preview-card">
                  <img [src]="image.preview">

                  <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    (click)="removeImage(image, $event)">
                    <i class="bi bi-x"></i>
                  </button>
                </div>

              }
            </div>
          </div>
          
          <input
            #fileInput
            type="file"
            accept="image/*"
            multiple
            hidden
            (change)="onFileSelected($event)">
        </div>

        <div class="needed-items mb-4">

          <label class="form-label">
            اگر می‌خوای تعداد بیش‌تری از آیتم‌های آماده رو همزمان داشته باشی یا آیتمی مد نظر داری که پیداش نمی‌کنی (آیتم سفارشی)، می‌تونی از این‌جا اضافش کنی
          </label>

          <div
            class="needed-item-row"
            *ngFor="let item of ExtraItems; let i = index">

            <div class="item-type-group d-flex flex-wrap">
              <label class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  [name]="'itemType' + i"
                  [(ngModel)]="item.isCustom"
                  [value]="false">
                <span class="form-check-label">آماده</span>
              </label>

              <label class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  [name]="'itemType' + i"
                  [(ngModel)]="item.isCustom"
                  [value]="true">
                <span class="form-check-label">سفارشی</span>
              </label>
            </div>

            <input
              class="form-control"
              placeholder="توضیح کوتاه"
              [(ngModel)]="item.description"
              name="itemDescription">

            <label class="reference-image upload-btn">

              <input
                hidden
                type="file"
                accept="image/*"
                (change)="onItemImageSelected($event, item)">

              <img
                *ngIf="item.preview"
                [src]="item.preview"
                alt="Reference image">

              <i
                *ngIf="!item.preview"
                class="bi bi-image"></i>

            </label>

            <button
              type="button"
              class="btn btn-danger remove-btn"
              (click)="removeItem(i)">
              <i class="bi bi-x"></i>
            </button>

          </div>

          <div>
            <button
            class="btn btn-primary mt-2"
            type="button"
            (click)="addItem()">

            <i class="bi bi-plus"></i>
            اضافه کردن آیتم

          </button>
          </div>

        </div>

        <div class="mb-4">
          <label for="descriptionTextarea" class="form-label">هر توضیح دیگه‌ای که لازم می‌دونی بدونیم رو اینجا اضافه کن (ویژگی‌های مهم، رنگ متفاوت برای آیتم‌ها و...)</label>
          <textarea class="form-control" id="descriptionTextarea" rows="3"></textarea>
        </div>
      </form>

      <app-creator-wizard [potatoName]="potatoName"></app-creator-wizard>
    </div>
  }

  <div class="d-flex gap-3 justify-content-center">
    <button
      *ngIf="maxSteps > currentStep"
      class="btn btn-primary btn-lg"
      (click)="next()">
      بعدی
    </button>

    <button
      *ngIf="maxSteps === currentStep"
      class="btn btn-primary btn-lg"
      (click)="next()">
      ثبت
    </button>

    <button
      *ngIf="currentStep > 1"
      class="btn btn-primary btn-lg"
      (click)="previous()">
      قبلی
    </button>
  </div>
</div>
