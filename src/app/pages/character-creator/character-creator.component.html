<div class="p-5">
  <div class="creator-steps">
    <div class="step" [class.active]="currentStep >= 1">۱</div>
    <div class="line" [class.active]="currentStep >= 2"></div>
    <div class="step" [class.active]="currentStep >= 2">۲</div>
    <div class="line" [class.active]="currentStep >= 3"></div>
    <div class="step" [class.active]="currentStep >= 3">۳</div>
  </div>

  @if (currentStep === 1) {
    <app-creator-explanation></app-creator-explanation>
  }

  @if (currentStep === 2) {
    <form>
      <div class="form-group mb-4">
        <label for="nameInput">اسم سیب‌زمینی</label>

        <input
          class="form-control"
          id="nameInput"
          name="nameInput"
          [(ngModel)]="potatoName">
      </div>

      <div class="form-group mb-4">
        <label for="fileInput">هر عکس رفرنسی که داری که می‌تونه به دقیق‌تر ساختن چیزی که توی ذهنته به ما کمک کنه این‌جا آپلود کن</label>

        <div class="upload-box"
          [class.drag-over]="isDragging"
          (click)="fileInput.click()"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)">

          <i class="bi bi-images fs-1"></i>

          <p class="mb-0">
            عکس‌ها را اینجا رها کنید
          </p>

          <small class="text-muted">
            یا کلیک کرده و انتخاب کنید
          </small>

          <div class="preview-grid mt-3">
            @for(image of images; track image.preview) {

              <div class="preview-card">
                <img [src]="image.preview">

                <button
                  type="button"
                  class="btn btn-danger btn-sm"
                  (click)="removeImage(image, $event)">
                  <i class="bi bi-x"></i>
                </button>
              </div>

            }
          </div>
        </div>
        
        <input
          #fileInput
          type="file"
          accept="image/*"
          multiple
          hidden
          (change)="onFileSelected($event)">
      </div>
    </form>

    <app-creator-wizard [potatoName]="potatoName"></app-creator-wizard>
  }

  <div class="d-flex gap-3 justify-content-center">
    <button
      *ngIf="maxSteps > currentStep"
      class="btn btn-primary btn-lg"
      (click)="next()">
      بعدی
    </button>

    <button
      *ngIf="maxSteps === currentStep"
      class="btn btn-primary btn-lg"
      (click)="next()">
      ثبت
    </button>

    <button
      *ngIf="currentStep > 1"
      class="btn btn-primary btn-lg"
      (click)="previous()">
      قبلی
    </button>
  </div>
</div>
