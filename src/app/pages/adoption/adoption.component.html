<app-loading *ngIf="!imagesLoaded"></app-loading>

<div 
  class="p-4 p-lg-5"
  [style.visibility]="imagesLoaded ? 'visible' : 'hidden'">
  
  <h3>
    کلی سیب‌زمینی با شخصیت‌های متفاوت... 
  </h3>
  <h3>
    <img src="/textures/chuck line.png" class="chuck">
    کدومشون رو خونه می‌بری؟
  </h3>

  <div class="row g-3 my-5">
    <div class="col-md-4">
      <label class="form-label">فیلتر بر اساس تیپ شخصیتی</label>
      <select class="form-select" [(ngModel)]="filterMbti" (change)="applyFilters()">
        <option value="">همه</option>
        <option *ngFor="let type of mbtiTypes" [value]="type.code" [style.color]="type.color">
          {{ type.code }} - {{ type.name }}
        </option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">فیلتر بر اساس ماه تولد</label>
      <select class="form-select" [(ngModel)]="filterMonth" (change)="applyFilters()">
        <option value="">همه</option>
        <option *ngFor="let month of months" [value]="month.name">
          {{ month.name }}
        </option>
      </select>
    </div>

    <div class="col-md-4 d-flex align-items-end">
      <button class="btn btn-secondary" (click)="resetFilters()">
        حذف فیلترها
      </button>
    </div>
  </div>

  <div *ngIf="filteredPotatoes.length > 0" class="cards-grid potato-stack">

    <div
      class="potato-wrapper"
      *ngFor="let potato of filteredPotatoes">

      <app-potato-card
        [potato]="potato">
      </app-potato-card>

    </div>

    <div class="sm-view" style="height: 100vh;"></div>

  </div>

  <div *ngIf="filteredPotatoes.length > 0" class="stack-end text-center sm-view mb-5">

    <img src="/textures/hr.png" class="hr my-4">
    
    فعلاً همینا رو داشتیم!
  
  </div>

  <p *ngIf="filteredPotatoes.length === 0" class="text-center text-muted">
    متاسفانه در حال حاضر سیب‌زمینی‌ای با این فیلترها نداریم!
  </p>

</div>
